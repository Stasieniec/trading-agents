name: mark

# After the US close plus the 15-minute data delay: fills, exits, corporate actions, marks, site data.
on:
  schedule:
    - cron: "47 21 * * 1-5"
    - cron: "17 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading
  cancel-in-progress: false

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q --require-hashes -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Gate
        id: gate
        run: python -m trading gate-mark
      - name: Mark
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python -m trading mark
      - name: Push
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git fetch -q origin main
          python -m trading scan-outgoing
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          exit 1
