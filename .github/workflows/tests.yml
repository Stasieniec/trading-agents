name: tests

on:
  push:
    branches: [main]
    paths: ["trading/**", "tests/**", "requirements*.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
