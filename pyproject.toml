[project]
name = "trading-agents"
version = "0.1.0"
description = "Live paper-trading experiment with Claude agents"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "exchange-calendars>=4.5",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
